name: Zbuduj aplikacje APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja srodowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20

      - name: Instalacja Capacitor i pakowanie do APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Moja Aplikacja" "com.example.myapp" --web-dir=.
          npx cap add android
          npx cap sync
          cd android && ./gradlew assembleDebug

      - name: Udostepnienie gotowego pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: aplikacja-na-telefon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
